name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - name: Install Dependencies
      run: npm install
    - name: Run Tests
      run: echo "No tests found for backend"

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - name: Install Dependencies
      run: npm install
    - name: Run unit tests
      run: npm test
    - name: Build project
      run: npm run build

  e2e-test:
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - name: Install Backend Dependencies
      run: npm install --prefix backend
    - name: Install Frontend Dependencies
      run: npm install --prefix frontend
    - name: Start Backend Server
      run: |
        cd backend
        npm start &
    - name: Start Frontend Server
      run: |
        cd frontend
        npm start &
    - name: Wait for servers to start
      run: sleep 30
    - name: Run E2E tests
      run: |
        cd frontend
        node selenium/ui.test.js
